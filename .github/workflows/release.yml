name: Build, Push & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (optional for cross-build)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }} # set GHCR_PAT in repo Secrets

      - name: Build & push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pod-designer-backend:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/pod-designer-backend:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pod-designer-frontend:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/pod-designer-frontend:latest

      - name: Build & push processor image
        uses: docker/build-push-action@v4
        with:
          context: ./processor
          file: ./processor/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pod-designer-processor:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/pod-designer-processor:latest

      - name: Save images as tar.gz artifacts
        run: |
          mkdir -p artifacts
          docker pull ghcr.io/${{ env.OWNER }}/pod-designer-backend:${{ env.TAG }}
          docker save ghcr.io/${{ env.OWNER }}/pod-designer-backend:${{ env.TAG }} | gzip > artifacts/backend-${{ env.TAG }}.tar.gz
          docker pull ghcr.io/${{ env.OWNER }}/pod-designer-frontend:${{ env.TAG }}
          docker save ghcr.io/${{ env.OWNER }}/pod-designer-frontend:${{ env.TAG }} | gzip > artifacts/frontend-${{ env.TAG }}.tar.gz
          docker pull ghcr.io/${{ env.OWNER }}/pod-designer-processor:${{ env.TAG }}
          docker save ghcr.io/${{ env.OWNER }}/pod-designer-processor:${{ env.TAG }} | gzip > artifacts/processor-${{ env.TAG }}.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-${{ env.TAG }}
          path: artifacts/*.tar.gz