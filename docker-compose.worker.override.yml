version: "3.9"

services:
  measurement-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pod-designer-backend:latest
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: poddb
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: pod
      MEASUREMENT_SERVICE_URL: http://measurement-service:8000
    command: ["node", "dist/workers/measurement_processing_worker.js"]
    depends_on:
      - redis
      - postgres
      - minio
      - measurement-service
    networks:
      - default

networks:
  default:
    name: pod-designer-net