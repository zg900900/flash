version: "3.9"
services:
  measurement-service:
    build:
      context: ./measurement_service
      dockerfile: Dockerfile
    image: measurement-service:local
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: pod
      S3_REGION: us-east-1
    ports:
      - "8000:8000"
    depends_on:
      - minio
    networks:
      - default

  backend:
    environment:
      MEASUREMENT_SERVICE_URL: http://measurement-service:8000
    depends_on:
      - measurement-service

networks:
  default:
    name: pod-designer-net